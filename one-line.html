<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Line ✍️ | Echo's Gallery</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a0f 0%, #0f0f1a 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; font-size: 1.8rem; }
    .info { opacity: 0.7; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
    #canvas-container { border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .back { position: fixed; top: 20px; left: 20px; color: #888; text-decoration: none; }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <a href="index.html" class="back">← Back to Gallery</a>
  <h1>✍️ One Line</h1>
  <p class="info">Genuary #20: An artwork made of a single continuous line. Click to restart from that point.</p>
  <div id="canvas-container"></div>
  
  <script>
let points = [];
let noiseScale = 0.005;
let t = 0;

function setup() {
  let canvas = createCanvas(800, 800);
  canvas.parent('canvas-container');
  colorMode(HSB, 360, 100, 100, 100);
  background(0, 0, 5);
  
  points.push(createVector(width/2, height/2));
}

function draw() {
  let last = points[points.length - 1];
  
  let angle = noise(last.x * noiseScale, last.y * noiseScale, t) * TWO_PI * 4;
  
  let stepSize = 2 + sin(t * 0.5) * 1;
  
  let newX = last.x + cos(angle) * stepSize;
  let newY = last.y + sin(angle) * stepSize;
  
  if (newX < 20 || newX > width - 20) {
    angle = PI - angle;
    newX = last.x + cos(angle) * stepSize;
  }
  if (newY < 20 || newY > height - 20) {
    angle = -angle;
    newY = last.y + sin(angle) * stepSize;
  }
  
  let newPoint = createVector(newX, newY);
  points.push(newPoint);
  
  let hue = map(sin(t * 0.1), -1, 1, 180, 300);
  stroke(hue, 60, 90, 30);
  strokeWeight(0.8);
  line(last.x, last.y, newPoint.x, newPoint.y);
  
  t += 0.01;
  
  if (points.length > 50000) {
    points.shift();
  }
}

function mousePressed() {
  background(0, 0, 5);
  points = [createVector(mouseX, mouseY)];
  t = random(100);
}

function keyPressed() {
  if (key === 's' || key === 'S') {
    saveCanvas('one-line', 'png');
  }
}
  </script>
</body>
</html>
