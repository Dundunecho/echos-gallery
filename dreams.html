  <style>
    :root {
      --bg-deep: #05050a;
      --bg-card: #0d0d15;
      --bg-card-hover: #141422;
      --accent: #8B7EC8;
      --accent-glow: #6B5CA8;
      --accent-warm: #C4A7E7;
      --text-primary: #e8e6e3;
      --text-secondary: #8a8693;
      --text-dim: #4a4656;
      --border: rgba(139, 126, 200, 0.15);
      --serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
      --sans: 'Source Sans 3', 'PingFang SC', -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: var(--bg-deep);
      color: var(--text-primary);
    }

    body {
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      min-height: 100vh;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg-deep);
    }

    /* ===== STARS BACKGROUND ===== */
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(ellipse at top, #0d0d1a 0%, var(--bg-deep) 70%),
        var(--bg-deep);
    }

    .stars::before,
    .stars::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.2), transparent),
        radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.4), transparent),
        radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.2), transparent),
        radial-gradient(1px 1px at 160px 120px, rgba(255,255,255,0.5), transparent);
      background-size: 200px 200px;
      animation: twinkle 8s ease-in-out infinite;
    }

    .stars::after {
      background-position: 50px 50px;
      animation-delay: -4s;
      opacity: 0.5;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ===== HEADER ===== */
    .header {
      position: relative;
      z-index: 10;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 4rem 2rem 6rem;
    }

    .hero-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 500;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-warm));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero .subtitle {
      color: var(--text-secondary);
      font-size: 1.1rem;
      font-style: italic;
      font-family: var(--serif);
    }

    /* ===== TIMELINE ===== */
    .timeline-section {
      position: relative;
      z-index: 1;
      padding: 0 2rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .timeline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 1.5rem 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .timeline::-webkit-scrollbar {
      display: none;
    }

    .timeline-dot {
      position: relative;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--accent-glow);
      cursor: pointer;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .timeline-dot::before {
      content: '';
      position: absolute;
      top: 50%;
      right: 100%;
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-glow));
      transform: translateY(-50%);
    }

    .timeline-dot:first-child::before {
      display: none;
    }

    .timeline-dot:hover,
    .timeline-dot.active {
      background: var(--accent);
      transform: scale(1.3);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .timeline-dot .tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 0.8rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      margin-bottom: 0.5rem;
    }

    .timeline-dot:hover .tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    /* ===== DREAM CARDS ===== */
    .dreams-container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    .dream-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 3rem;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .dream-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(139, 126, 200, 0.15);
    }

    .dream-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--border);
    }

    .dream-content {
      padding: 2rem;
    }

    .dream-date {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dream-text {
      font-family: var(--serif);
      font-size: 1.1rem;
      line-height: 1.9;
      color: var(--text-secondary);
      font-style: italic;
    }

    .dream-text p {
      margin-bottom: 1rem;
    }

    .dream-text p:last-child {
      margin-bottom: 0;
    }

    /* ===== FOOTER ===== */
    .footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        gap: 1rem;
      }

      .dream-content {
        padding: 1.5rem;
      }

      .timeline-dot::before {
        width: 20px;
      }
    }
  </style>
</head>

    // Render timeline
    const timeline = document.getElementById('timeline');
    dreams.forEach((dream, index) => {
      const dot = document.createElement('div');
      dot.className = 'timeline-dot' + (index === 0 ? ' active' : '');
      dot.innerHTML = `<span class="tooltip">${dream.date}</span>`;
      dot.onclick = () => {
        document.querySelectorAll('.timeline-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        document.getElementById(`dream-${index}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
      };
      timeline.appendChild(dot);
    });

    // Render dream cards
    const container = document.getElementById('dreams');
    dreams.forEach((dream, index) => {
      const card = document.createElement('article');
      card.className = 'dream-card';
      card.id = `dream-${index}`;
      
      const paragraphs = dream.text.split('\n\n').map(p => `<p>${p}</p>`).join('');
      
      card.innerHTML = `
        <img src="${dream.image}" alt="Dream of ${dream.date}" class="dream-image" loading="lazy">
        <div class="dream-content">
          <div class="dream-date">🌙 ${dream.date}</div>
          <div class="dream-text">${paragraphs}</div>
        </div>
      `;
      container.appendChild(card);
    });

    // Intersection Observer for timeline sync
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const index = parseInt(entry.target.id.split('-')[1]);
          document.querySelectorAll('.timeline-dot').forEach((d, i) => {
            d.classList.toggle('active', i === index);
          });
        }
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('.dream-card').forEach(card => observer.observe(card));
  </script>
