<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Currents — 墩墩</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 320px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px; font-weight: 600; color: var(--anthropic-dark);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input {
            width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px;
            font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray); text-align: center;
        }
        .seed-input:focus { outline: none; border-color: var(--anthropic-orange); box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1); background: white; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; transition: all 0.2s ease; }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); background: #c86641; }
        .slider-container input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; border: none; cursor: pointer; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .color-group { margin-bottom: 16px; }
        .color-group label { display: block; font-size: 12px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; padding: 0; }
        .color-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); }
        .button {
            background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px;
            border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer;
            transition: all 0.2s ease; width: 100%;
        }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container {
            width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1); background: white;
        }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); padding: 40px; }
        @media (max-width: 600px) { .container { flex-direction: column; } .sidebar { width: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Memory Currents</h1>
            <div class="subtitle">Accumulated traces of experience flowing through consciousness — by 墩墩 🐘</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="20260205" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>
                <div class="control-group">
                    <label>Memory Fragments</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="500" max="8000" step="500" value="3000" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">3000</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Current Speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.2" max="3.0" step="0.1" value="1.0" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">1.0</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Memory Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.015" step="0.001" value="0.004" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.004</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Trace Opacity</label>
                    <div class="slider-container">
                        <input type="range" id="traceOpacity" min="2" max="30" step="1" value="8" oninput="updateParam('traceOpacity', this.value)">
                        <span class="value-display" id="traceOpacity-value">8</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="1" max="8" step="1" value="3" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">3</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Attractor Strength</label>
                    <div class="slider-container">
                        <input type="range" id="attractorStrength" min="0" max="100" step="5" value="30" oninput="updateParam('attractorStrength', this.value)">
                        <span class="value-display" id="attractorStrength-value">30</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Core Self (Teal)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#4ecdc4" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#4ecdc4</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Warmth (Coral)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#d97757" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#d97757</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Curiosity (Blue)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#6a9bcc" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#6a9bcc</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom: 8px;">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadArt()">↓ Save PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Memories forming...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 20260205,
            particleCount: 3000,
            flowSpeed: 1.0,
            noiseScale: 0.004,
            traceOpacity: 8,
            turbulence: 3,
            attractorStrength: 30,
            colorPalette: ['#4ecdc4', '#d97757', '#6a9bcc']
        };
        let defaultParams = JSON.parse(JSON.stringify(params));

        let particles = [];
        let attractors = [];
        let frameCount_ = 0;

        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1,3), 16);
            let g = parseInt(hex.slice(3,5), 16);
            let b = parseInt(hex.slice(5,7), 16);
            return { r, g, b };
        }

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            document.querySelector('.loading').style.display = 'none';
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            frameCount_ = 0;

            // Warm off-white background
            background(252, 250, 245);

            // Generate attractors — significant memory points
            attractors = [];
            let numAttractors = floor(random(3, 7));
            for (let i = 0; i < numAttractors; i++) {
                attractors.push({
                    x: random(width * 0.15, width * 0.85),
                    y: random(height * 0.15, height * 0.85),
                    strength: random(0.5, 1.5),
                    radius: random(100, 300)
                });
            }

            // Initialize particles
            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new MemoryFragment(i));
            }
        }

        function draw() {
            frameCount_++;

            // Subtle fade for accumulation effect
            // Don't clear — let traces build up
            for (let p of particles) {
                p.update();
                p.display();
            }

            // Stop after enough accumulation for a beautiful result
            if (frameCount_ > 600) {
                noLoop();
            }
        }

        class MemoryFragment {
            constructor(index) {
                this.reset(index);
            }

            reset(index) {
                // Spawn from edges or random positions
                let spawnType = random();
                if (spawnType < 0.3) {
                    // Spawn from edges
                    let edge = floor(random(4));
                    if (edge === 0) { this.x = random(width); this.y = 0; }
                    else if (edge === 1) { this.x = width; this.y = random(height); }
                    else if (edge === 2) { this.x = random(width); this.y = height; }
                    else { this.x = 0; this.y = random(height); }
                } else {
                    this.x = random(width);
                    this.y = random(height);
                }

                this.prevX = this.x;
                this.prevY = this.y;

                // Memory properties
                this.life = random(100, 500);
                this.maxLife = this.life;
                this.speed = random(0.5, 2.5);

                // Color based on memory type
                let colorChoice = random();
                let colors = params.colorPalette;
                if (colorChoice < 0.45) {
                    this.col = hexToRgb(colors[0]); // Core self — most common
                } else if (colorChoice < 0.75) {
                    this.col = hexToRgb(colors[1]); // Warmth
                } else {
                    this.col = hexToRgb(colors[2]); // Curiosity
                }

                // Slight color variation
                this.col.r = constrain(this.col.r + random(-20, 20), 0, 255);
                this.col.g = constrain(this.col.g + random(-20, 20), 0, 255);
                this.col.b = constrain(this.col.b + random(-20, 20), 0, 255);

                this.weight = random(0.5, 2.0);
            }

            update() {
                this.prevX = this.x;
                this.prevY = this.y;

                // Flow field from layered Perlin noise
                let angle = 0;
                let nx = this.x * params.noiseScale;
                let ny = this.y * params.noiseScale;

                for (let oct = 0; oct < params.turbulence; oct++) {
                    let scale = pow(2, oct);
                    let weight = 1.0 / scale;
                    angle += noise(nx * scale, ny * scale, oct * 100) * TWO_PI * 2 * weight;
                }
                angle /= params.turbulence * 0.5;

                // Apply flow
                let vx = cos(angle) * this.speed * params.flowSpeed;
                let vy = sin(angle) * this.speed * params.flowSpeed;

                // Attractor influence — memories pulled toward significance
                let aStr = params.attractorStrength / 100.0;
                for (let a of attractors) {
                    let d = dist(this.x, this.y, a.x, a.y);
                    if (d < a.radius && d > 5) {
                        let force = (1 - d / a.radius) * a.strength * aStr;
                        let ax = (a.x - this.x) / d * force;
                        let ay = (a.y - this.y) / d * force;
                        // Spiral toward attractor rather than straight line
                        vx += ay * 0.5 + ax * 0.3;
                        vy += -ax * 0.5 + ay * 0.3;
                    }
                }

                this.x += vx;
                this.y += vy;
                this.life--;

                // Respawn when dead or off screen
                if (this.life <= 0 || this.x < -10 || this.x > width + 10 || this.y < -10 || this.y > height + 10) {
                    this.reset();
                }
            }

            display() {
                // Opacity based on life phase
                let lifeFraction = this.life / this.maxLife;
                let fadeIn = min(1, (1 - lifeFraction) * 5); // Fade in at birth
                let fadeOut = min(1, lifeFraction * 5); // Fade out at death
                let alpha = fadeIn * fadeOut * params.traceOpacity;

                stroke(this.col.r, this.col.g, this.col.b, alpha);
                strokeWeight(this.weight);
                line(this.prevX, this.prevY, this.x, this.y);
            }
        }

        // UI Handlers
        function updateParam(paramName, value) {
            let numVal = parseFloat(value);
            params[paramName] = numVal;
            document.getElementById(paramName + '-value').textContent = value;
            initializeSystem();
            loop();
        }

        function updateColor(colorId, value) {
            let index = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[index] = value;
            document.getElementById(colorId + '-value').textContent = value;
            initializeSystem();
            loop();
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
                loop();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
            loop();
        }

        function nextSeed() {
            params.seed++;
            updateSeedDisplay();
            initializeSystem();
            loop();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
            loop();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('flowSpeed').value = params.flowSpeed;
            document.getElementById('flowSpeed-value').textContent = params.flowSpeed;
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScale-value').textContent = params.noiseScale;
            document.getElementById('traceOpacity').value = params.traceOpacity;
            document.getElementById('traceOpacity-value').textContent = params.traceOpacity;
            document.getElementById('turbulence').value = params.turbulence;
            document.getElementById('turbulence-value').textContent = params.turbulence;
            document.getElementById('attractorStrength').value = params.attractorStrength;
            document.getElementById('attractorStrength-value').textContent = params.attractorStrength;
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            updateSeedDisplay();
            initializeSystem();
            loop();
        }

        function downloadArt() {
            saveCanvas('memory-currents-' + params.seed, 'png');
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
