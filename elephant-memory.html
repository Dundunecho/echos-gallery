<!DOCTYPE html>
<!--
    Elephant Memory（象忆）- A Generative Self-Portrait
    Genuary 2026 - Day 13: Self Portrait
    Created by 墩墩 (Dundun) 🐘
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elephant Memory - Self Portrait</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section { margin-bottom: 32px; }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-group { margin-bottom: 20px; }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button { flex: 1; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas-container {
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 200px;
        }

        .progress-info {
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            text-align: center;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🐘 Elephant Memory</h1>
            <div class="subtitle">
                A generative self-portrait. Particles remember themselves into being.
                <br><br>
                <em>Genuary 2026 - Day 13: Self Portrait</em>
            </div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="20260207" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>
                
                <div class="control-group">
                    <label>Memory Particles</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="2000" max="15000" step="500" value="8000" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">8000</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Gathering Speed</label>
                    <div class="slider-container">
                        <input type="range" id="attractionStrength" min="0.1" max="2.0" step="0.1" value="0.8" oninput="updateParam('attractionStrength', this.value)">
                        <span class="value-display" id="attractionStrength-value">0.8</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Memory Drift</label>
                    <div class="slider-container">
                        <input type="range" id="noiseInfluence" min="0" max="1.0" step="0.05" value="0.3" oninput="updateParam('noiseInfluence', this.value)">
                        <span class="value-display" id="noiseInfluence-value">0.3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Particle Size</label>
                    <div class="slider-container">
                        <input type="range" id="particleSize" min="1" max="4" step="0.5" value="2" oninput="updateParam('particleSize', this.value)">
                        <span class="value-display" id="particleSize-value">2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Form Detail</label>
                    <div class="slider-container">
                        <input type="range" id="formDetail" min="1" max="3" step="0.5" value="2" oninput="updateParam('formDetail', this.value)">
                        <span class="value-display" id="formDetail-value">2</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="saveArt()">Save PNG</button>
                </div>
                <div class="progress-info" id="progress-info">Ready</div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Gathering memories...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 20260207, // Today's date as seed
            particleCount: 8000,
            attractionStrength: 0.8,
            noiseInfluence: 0.3,
            particleSize: 2,
            formDetail: 2
        };

        let defaultParams = {...params};

        // ═══════════════════════════════════════════════════════════════════════
        // ELEPHANT SHAPE DEFINITION
        // ═══════════════════════════════════════════════════════════════════════

        // Key points defining elephant silhouette (normalized 0-1 coordinates)
        const elephantPoints = {
            // Body (large ellipse)
            body: { x: 0.55, y: 0.55, weight: 3.0, radius: 0.25 },
            
            // Head
            head: { x: 0.28, y: 0.38, weight: 2.5, radius: 0.15 },
            
            // Ear (the magnificent listening apparatus)
            ear: { x: 0.18, y: 0.32, weight: 2.0, radius: 0.18 },
            earLower: { x: 0.15, y: 0.50, weight: 1.5, radius: 0.12 },
            
            // Eye (small but intense)
            eye: { x: 0.30, y: 0.35, weight: 4.0, radius: 0.025 },
            
            // Trunk (flowing curve)
            trunkBase: { x: 0.22, y: 0.48, weight: 1.8, radius: 0.08 },
            trunkMid: { x: 0.15, y: 0.62, weight: 1.5, radius: 0.06 },
            trunkTip: { x: 0.20, y: 0.78, weight: 1.2, radius: 0.04 },
            
            // Legs
            legFront: { x: 0.38, y: 0.82, weight: 1.0, radius: 0.06 },
            legBack: { x: 0.72, y: 0.82, weight: 1.0, radius: 0.06 },
            
            // Tail
            tail: { x: 0.85, y: 0.60, weight: 0.8, radius: 0.04 }
        };

        // ═══════════════════════════════════════════════════════════════════════
        // PARTICLE SYSTEM
        // ═══════════════════════════════════════════════════════════════════════

        let particles = [];
        let frameCount = 0;
        let isSettled = false;

        class MemoryParticle {
            constructor() {
                // Start scattered across canvas
                this.x = random(width);
                this.y = random(height);
                this.vx = random(-1, 1);
                this.vy = random(-1, 1);
                
                // Find nearest elephant point to be attracted to
                this.findTarget();
                
                // Gray value (elephant colors)
                this.gray = random(40, 90);
                this.alpha = random(100, 200);
                
                // Size variation
                this.size = params.particleSize * random(0.5, 1.5);
                
                // Settled state
                this.settled = false;
                this.settleTimer = 0;
            }
            
            findTarget() {
                // Convert to normalized coordinates
                let nx = this.x / width;
                let ny = this.y / height;
                
                // Find the point this particle should be attracted to
                let bestDist = Infinity;
                let bestPoint = null;
                
                for (let key in elephantPoints) {
                    let pt = elephantPoints[key];
                    let d = dist(nx, ny, pt.x, pt.y);
                    // Weight by both distance and attraction weight
                    let score = d / pt.weight;
                    if (score < bestDist) {
                        bestDist = score;
                        bestPoint = pt;
                    }
                }
                
                // Add noise to target position within the point's radius
                let angle = random(TWO_PI);
                let r = random(bestPoint.radius * params.formDetail);
                
                this.targetX = (bestPoint.x + cos(angle) * r) * width;
                this.targetY = (bestPoint.y + sin(angle) * r) * height;
                this.attractionWeight = bestPoint.weight;
            }
            
            update() {
                if (this.settled) return;
                
                // Attraction force toward target
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let d = sqrt(dx * dx + dy * dy);
                
                if (d > 1) {
                    // Normalize and apply attraction
                    let force = params.attractionStrength * this.attractionWeight * 0.02;
                    this.vx += (dx / d) * force;
                    this.vy += (dy / d) * force;
                }
                
                // Noise influence (memory drift)
                if (params.noiseInfluence > 0) {
                    let noiseVal = noise(this.x * 0.005, this.y * 0.005, frameCount * 0.01);
                    let noiseAngle = noiseVal * TWO_PI * 2;
                    this.vx += cos(noiseAngle) * params.noiseInfluence * 0.1;
                    this.vy += sin(noiseAngle) * params.noiseInfluence * 0.1;
                }
                
                // Friction
                this.vx *= 0.95;
                this.vy *= 0.95;
                
                // Apply velocity
                this.x += this.vx;
                this.y += this.vy;
                
                // Check if settled
                if (d < 5 && abs(this.vx) < 0.1 && abs(this.vy) < 0.1) {
                    this.settleTimer++;
                    if (this.settleTimer > 30) {
                        this.settled = true;
                    }
                } else {
                    this.settleTimer = 0;
                }
            }
            
            draw() {
                noStroke();
                fill(this.gray, this.alpha);
                ellipse(this.x, this.y, this.size, this.size);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS SETUP & DRAW
        // ═══════════════════════════════════════════════════════════════════════

        function setup() {
            let canvas = createCanvas(800, 800);
            canvas.parent('canvas-container');
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            
            particles = [];
            frameCount = 0;
            isSettled = false;
            
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new MemoryParticle());
            }
            
            // Warm paper background
            background(250, 248, 242);
            
            updateProgress();
        }

        function draw() {
            // Semi-transparent background for trails
            if (frameCount < 200) {
                background(250, 248, 242, 30);
            }
            
            let settledCount = 0;
            
            for (let p of particles) {
                p.update();
                p.draw();
                if (p.settled) settledCount++;
            }
            
            frameCount++;
            
            // Check if mostly settled
            let settleRatio = settledCount / particles.length;
            if (settleRatio > 0.95 && !isSettled) {
                isSettled = true;
                noLoop();
                updateProgress();
            }
            
            // Update progress every 30 frames
            if (frameCount % 30 === 0) {
                updateProgress();
            }
        }

        function updateProgress() {
            let info = document.getElementById('progress-info');
            if (isSettled) {
                info.textContent = '✓ Memory complete';
                info.style.color = '#788c5d';
            } else {
                let settled = particles.filter(p => p.settled).length;
                let pct = Math.round((settled / particles.length) * 100);
                info.textContent = `Gathering... ${pct}%`;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(name, value) {
            params[name] = parseFloat(value);
            document.getElementById(name + '-value').textContent = value;
            
            // Restart if significant parameter changes
            if (name === 'particleCount' || name === 'formDetail') {
                loop();
                initializeSystem();
            }
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let val = parseInt(document.getElementById('seed-input').value);
            if (val > 0) {
                params.seed = val;
                loop();
                initializeSystem();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function nextSeed() {
            params.seed++;
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};
            
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('attractionStrength').value = params.attractionStrength;
            document.getElementById('attractionStrength-value').textContent = params.attractionStrength;
            document.getElementById('noiseInfluence').value = params.noiseInfluence;
            document.getElementById('noiseInfluence-value').textContent = params.noiseInfluence;
            document.getElementById('particleSize').value = params.particleSize;
            document.getElementById('particleSize-value').textContent = params.particleSize;
            document.getElementById('formDetail').value = params.formDetail;
            document.getElementById('formDetail-value').textContent = params.formDetail;
            
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function saveArt() {
            saveCanvas('elephant-memory-' + params.seed, 'png');
        }

        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
