<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D SDF Playground - Echo's Gallery No.013</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0f; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        canvas { 
            cursor: crosshair;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #666;
            font-size: 12px;
        }
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #888;
            font-size: 12px;
            text-align: right;
            line-height: 1.8;
        }
        .key { color: #4ECDC4; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">2D SDF Playground · No.013 · 🐘</div>
    <div class="controls">
        <span class="key">1-5</span> change shape<br>
        <span class="key">Space</span> toggle mode<br>
        <span class="key">Mouse</span> move shape
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const SIZE = Math.min(window.innerWidth, window.innerHeight) - 40;
        canvas.width = SIZE;
        canvas.height = SIZE;
        
        let mouseX = SIZE / 2;
        let mouseY = SIZE / 2;
        let time = 0;
        let shapeType = 0;
        let showDistance = true;
        
        const shapes = ['circle', 'box', 'diamond', 'star', 'heart'];
        
        // 2D SDF functions (inspired by Inigo Quilez)
        function sdCircle(px, py, cx, cy, r) {
            const dx = px - cx;
            const dy = py - cy;
            return Math.sqrt(dx * dx + dy * dy) - r;
        }
        
        function sdBox(px, py, cx, cy, w, h) {
            const dx = Math.abs(px - cx) - w;
            const dy = Math.abs(py - cy) - h;
            return Math.sqrt(Math.max(dx, 0) ** 2 + Math.max(dy, 0) ** 2) + 
                   Math.min(Math.max(dx, dy), 0);
        }
        
        function sdDiamond(px, py, cx, cy, size) {
            const dx = Math.abs(px - cx);
            const dy = Math.abs(py - cy);
            return (dx + dy - size) / Math.sqrt(2);
        }
        
        function sdStar(px, py, cx, cy, r, n) {
            const dx = px - cx;
            const dy = py - cy;
            const angle = Math.atan2(dy, dx);
            const dist = Math.sqrt(dx * dx + dy * dy);
            const slice = Math.PI * 2 / n;
            const a = ((angle % slice) + slice) % slice;
            const b = Math.min(a, slice - a);
            return dist * Math.cos(b) - r * 0.6;
        }
        
        function sdHeart(px, py, cx, cy, size) {
            let dx = (px - cx) / size;
            let dy = (py - cy) / size - 0.3;
            dy = -dy; // flip
            
            const a = Math.sqrt(dx * dx + dy * dy);
            const b = Math.sqrt(dx * dx + (dy - Math.min(0, dx * dx) * 0.5) ** 2);
            
            if (dx * dx + (dy - 0.5) * (dy - 0.5) < 0.5 * 0.5 && dy > 0) {
                return (a - 0.5) * size;
            }
            return (Math.min(a, b) - 0.5) * size;
        }
        
        function getSDF(px, py) {
            const r = SIZE * 0.15;
            switch (shapeType) {
                case 0: return sdCircle(px, py, mouseX, mouseY, r);
                case 1: return sdBox(px, py, mouseX, mouseY, r, r * 0.7);
                case 2: return sdDiamond(px, py, mouseX, mouseY, r * 1.2);
                case 3: return sdStar(px, py, mouseX, mouseY, r, 5);
                case 4: return sdHeart(px, py, mouseX, mouseY, r * 1.5);
            }
        }
        
        function draw() {
            const imageData = ctx.createImageData(SIZE, SIZE);
            const data = imageData.data;
            
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    const i = (y * SIZE + x) * 4;
                    const d = getSDF(x, y);
                    
                    let r, g, b;
                    
                    if (showDistance) {
                        // Distance field visualization
                        const bands = Math.sin(d * 0.3 + time * 0.05) * 0.5 + 0.5;
                        
                        if (d < 0) {
                            // Inside: warm colors
                            r = 80 + bands * 100;
                            g = 50 + bands * 50;
                            b = 100 + bands * 80;
                        } else {
                            // Outside: cool colors  
                            const fade = Math.exp(-d * 0.02);
                            r = 10 + bands * 40 * fade;
                            g = 30 + bands * 80 * fade;
                            b = 50 + bands * 120 * fade;
                        }
                        
                        // Edge glow
                        const edge = Math.exp(-Math.abs(d) * 0.1);
                        r += edge * 100;
                        g += edge * 180;
                        b += edge * 170;
                    } else {
                        // Simple inside/outside
                        if (d < 0) {
                            r = 78; g = 205; b = 196;
                        } else {
                            r = 15; g = 15; b = 25;
                        }
                        
                        // Edge
                        if (Math.abs(d) < 2) {
                            r = 255; g = 255; b = 255;
                        }
                    }
                    
                    data[i] = Math.min(255, r);
                    data[i + 1] = Math.min(255, g);
                    data[i + 2] = Math.min(255, b);
                    data[i + 3] = 255;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Shape name
            ctx.fillStyle = '#fff';
            ctx.font = '14px Courier New';
            ctx.fillText(shapes[shapeType].toUpperCase(), 20, 30);
            ctx.fillStyle = '#666';
            ctx.fillText(showDistance ? 'distance field' : 'binary', 20, 50);
        }
        
        function animate() {
            time++;
            draw();
            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5') {
                shapeType = parseInt(e.key) - 1;
            } else if (e.code === 'Space') {
                showDistance = !showDistance;
                e.preventDefault();
            }
        });
        
        animate();
    </script>
</body>
</html>
