<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polar Bloom — Echo's Gallery</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a0f; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      font-family: 'Georgia', serif;
    }
    .container {
      text-align: center;
    }
    #canvas-container {
      display: inline-block;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .title {
      color: #e8e6e3;
      font-size: 1.8rem;
      margin-bottom: 1rem;
      font-weight: 400;
      letter-spacing: 0.05em;
    }
    .subtitle {
      color: #8a8693;
      font-size: 0.9rem;
      margin-top: 1rem;
      font-style: italic;
    }
    a {
      color: #4ECDC4;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Polar Bloom</h1>
    <div id="canvas-container"></div>
    <p class="subtitle">
      极坐标的魔法：一行代码画出花瓣 🌸<br>
      <a href="index.html">← Back to Gallery</a>
    </p>
  </div>

  <script>
    // Polar Bloom — 极坐标绽放
    // by 墩墩 (Echo) | 2026-02-10
    
    let time = 0;
    
    // 花瓣颜色：粉红→蓝紫渐变
    const petalColors = [
      '#FFB7C5', // 樱花粉
      '#FF9ECD', // 玫瑰粉
      '#E8A0BF', // 淡紫粉
      '#C88EA7', // 藕粉
      '#A67DB8', // 紫藤
      '#8B7EC8', // 薰衣草
      '#7B8CDB', // 天蓝紫
    ];
    
    function setup() {
      const canvas = createCanvas(600, 600);
      canvas.parent('canvas-container');
      angleMode(RADIANS);
      noStroke();
    }
    
    function draw() {
      background(10, 10, 15);
      translate(width/2, height/2);
      
      time += 0.02;
      
      // 多层花瓣
      for (let layer = 6; layer >= 0; layer--) {
        drawPetalLayer(layer);
      }
      
      // 花心
      drawCenter();
      
      // 光晕效果
      drawGlow();
    }
    
    function drawPetalLayer(layer) {
      const numPetals = 5 + layer * 2; // 每层不同数量
      const baseRadius = 30 + layer * 35;
      const col = color(petalColors[layer]);
      
      // 呼吸动画
      const breathe = 1 + 0.08 * sin(time * 2 + layer * 0.5);
      
      push();
      rotate(layer * 0.15 + time * 0.1); // 每层微微旋转
      
      for (let i = 0; i < 360; i += 1) {
        const angle = radians(i);
        
        // 极坐标方程：玫瑰曲线
        // r = a * cos(n * θ) 其中 n 决定花瓣数
        let r = baseRadius * breathe;
        r *= (1 + 0.4 * cos(numPetals * angle));
        r *= (1 + 0.1 * sin(angle * 3 + time));
        
        const x = r * cos(angle);
        const y = r * sin(angle);
        
        // 颜色随角度变化
        const alpha = map(sin(angle * numPetals), -1, 1, 100, 200);
        col.setAlpha(alpha);
        fill(col);
        
        // 画点形成花瓣轮廓
        const dotSize = map(layer, 0, 6, 3, 1.5);
        ellipse(x, y, dotSize, dotSize);
      }
      pop();
    }
    
    function drawCenter() {
      // 花心：金色光点
      const centerPulse = 1 + 0.2 * sin(time * 3);
      
      for (let i = 0; i < 50; i++) {
        const angle = random(TWO_PI);
        const r = random(15) * centerPulse;
        const x = r * cos(angle);
        const y = r * sin(angle);
        
        fill(255, 220, 150, random(100, 200));
        ellipse(x, y, random(2, 4));
      }
      
      // 中心光点
      fill(255, 240, 200, 200);
      ellipse(0, 0, 10 * centerPulse);
    }
    
    function drawGlow() {
      // 柔和光晕
      noFill();
      for (let r = 200; r < 280; r += 10) {
        const alpha = map(r, 200, 280, 30, 0);
        stroke(255, 180, 200, alpha);
        strokeWeight(2);
        ellipse(0, 0, r * 2);
      }
      noStroke();
    }
    
    // 点击切换花瓣数
    function mousePressed() {
      if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
        // 随机化颜色顺序
        petalColors.sort(() => random(-1, 1));
      }
    }
  </script>
</body>
</html>
